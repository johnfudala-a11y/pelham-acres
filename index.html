<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pelham Acres">
<meta name="theme-color" content="#5E8C3E">
<title>Pelham Acres</title>
<meta name="description" content="Grow a cozy farm into a thriving country town, with two very good cats. No ads, ever.">
<!-- link previews (Messages, Facebook, etc.) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pelham Acres">
<meta property="og:title" content="Pelham Acres">
<meta property="og:description" content="Grow a cozy farm into a thriving country town, with two very good cats. No ads, ever.">
<meta property="og:url" content="https://johnfudala-a11y.github.io/pelham-acres/">
<meta property="og:image" content="https://johnfudala-a11y.github.io/pelham-acres/icons/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A cozy painted farm village with a red barn, a windmill and two cats, under the title Pelham Acres">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://johnfudala-a11y.github.io/pelham-acres/icons/share.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- the font loads in the background so a slow connection can never hold up the game starting -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="pill lvl" id="lvlPill"><b id="lvl">1</b><div class="xpbar"><div id="xpfill"></div></div><small id="xptext"></small></div>
  <div class="pill" id="coinPill"><img class="ui" src="sprites/icon-coin.webp" alt="Coins"> <span id="coins">0</span></div>
  <div class="pill" id="hgPill"><img class="ui" src="sprites/icon-hourglass.webp" alt="Hourglasses"> <span id="hg">0</span></div>
  <div class="pill" id="storePill"><img class="ui" src="sprites/icon-crate.webp" alt="Barn space"> <span id="store">0/50</span></div>
  <div class="pill" id="seasonPill"></div>
</div>

<button id="hint" hidden></button>
<button id="soundBtn" class="pill" aria-label="Sound on or off"><img class="ui" src="sprites/icon-sound.webp" alt=""></button>

<div id="toolbar">
  <button class="tb" data-tb="shop"><img src="sprites/icon-hammer.webp" alt=""><span>Build</span></button>
  <button class="tb" data-tb="quests"><img src="sprites/icon-scroll.webp" alt=""><span>Quests</span><i class="badge" id="questBadge" hidden></i></button>
  <button class="tb" data-tb="orders"><img src="sprites/icon-mail.webp" alt=""><span>Orders</span><i class="badge" id="ordBadge" hidden></i></button>
  <button class="tb" data-tb="barn"><img src="sprites/icon-barn.webp" alt=""><span>Barn</span></button>
  <button class="tb" data-tb="explore"><img src="sprites/icon-map.webp" alt=""><span>Explore</span></button>
  <button class="tb" data-tb="menu"><img src="sprites/icon-journal.webp" alt=""><span>Menu</span></button>
</div>

<div id="modebar" hidden></div>

<div id="sheet" aria-hidden="true">
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button id="sheetClose" aria-label="Close">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div id="exp" hidden>
  <div class="exp-head">
    <div class="exp-tabs" id="expTabs"></div>
    <div class="energy"><b><img class="ui" src="sprites/icon-energy.webp" alt="Energy"> <span id="enVal">0</span></b><div class="ebar"><div id="enFill"></div></div><small id="enNext"></small></div>
    <button id="expClose" aria-label="Back to farm"><img src="sprites/icon-barn.webp" alt="" style="height:32px"></button>
  </div>
  <div class="exp-body" id="expBody"><div class="exp-grid" id="expGrid"></div></div>
  <div class="exp-foot" id="expFoot"></div>
</div>

<div id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<div id="toast"></div>
<div id="hudTip" hidden></div>

<!-- Safety net: if the game hasn't started after a few seconds (e.g. the device caught a half-finished update),
     offer a one-tap fresh reload that clears the offline copies. Your farm is not touched. -->
<div id="bootFail" hidden><div class="bootcard"><b>Pelham Acres is having trouble starting</b>
  <p>This can happen right after an update. Your farm is safe.</p><button id="bootFix">Tap to refresh</button></div></div>
<script>
  (function () {
    function show() { if (window.__booted) return; var b = document.getElementById('bootFail'); if (b) b.hidden = false; }
    setTimeout(show, 9000);
    window.addEventListener('error', function () { setTimeout(show, 2500); });
    window.addEventListener('unhandledrejection', function () { setTimeout(show, 2500); });
    document.getElementById('bootFix').onclick = function () {
      var done = function () { location.replace(location.pathname + '?fresh=' + Date.now()); };
      var jobs = [];
      if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      Promise.all(jobs).then(done, done);
    };
  })();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
